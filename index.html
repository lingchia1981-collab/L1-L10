    function generateQuestionData() {
        const allHanzi = vocabularyList.map(v => v.word);
        const allPinyin = vocabularyList.map(v => v.pinyin);

        return vocabularyList.map(item => {
            const hanziDistractors = getRandomItems(allHanzi.filter(h => h !== item.word), 3);
            const pinyinDistractors = getRandomItems(allPinyin.filter(p => p !== item.pinyin), 3);

            return {
                word: item.word,
                pinyin: item.pinyin,
                hanziOptions: [item.word, ...hanziDistractors],
                pinyinOptions: [item.pinyin, ...pinyinDistractors]
            };
        });
    }

    function getRandomItems(arr, count) {
        const shuffled = [...arr].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, count);
    }

    function initAudioContext() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSuccessSound() {
        initAudioContext();
        try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            osc.frequency.setValueAtTime(783.99, now + 0.2);
            osc.frequency.setValueAtTime(1046.50, now + 0.3);

            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.6);
        } catch (e) {
            console.log("Sound play error", e);
        }
    }

    function playErrorSound() {
        initAudioContext();
        try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.setValueAtTime(200, now + 0.15);

            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.35);
        } catch (e) {
            console.log("Sound play error", e);
        }
    }

    function initBackgroundMusic() {
        if (backgroundMusic) return;
        try {
            initAudioContext();
            const notes = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50];

            function playNote() {
                if (audioCtx.state === 'suspended') return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(notes[Math.floor(Math.random() * notes.length)], audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            }
            backgroundMusic = setInterval(playNote, 1200);
        } catch (e) {
            console.log("Web Audio API not supported", e);
        }
    }

    function playGoogleTranslateAudio() {
        if (currentIndex >= shuffledQuestions.length) return;
        if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
        }
        const q = shuffledQuestions[currentIndex];
        
        // 傳入漢字 word（例如「差不多」），tl=zh-TW 會發出標準的國語（中文）語音
        const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(q.word)}&tl=zh-TW&client=gtx`;
        
        currentAudio = new Audio(audioUrl);
        currentAudio.play().catch(error => {
            console.log("Google Translate Audio play failed:", error);
        });
    }

    function shuffleCurrentQuestions() {
        questions = generateQuestionData();
        shuffledQuestions = [...questions].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        score = 0;
        document.getElementById('score-display').innerText = `⭐ Score: ${score}`;
        loadQuestion();
    }

        initBackgroundMusic();
        shuffleCurrentQuestions();

        const container = document.getElementById('game-container');
        const containerRect = container.getBoundingClientRect();
        const targetRect = targetElement.getBoundingClientRect();

        const bullet = document.createElement('div');
        bullet.className = 'bullet';
        const startX = containerRect.width / 2 - 7;
        const startY = containerRect.height - 20;
        bullet.style.left = `${startX}px`;
        bullet.style.top = `${startY}px`;
        container.appendChild(bullet);

        const destX = targetRect.left - containerRect.left + targetRect.width / 2 - 7;
        const destY = targetRect.top - containerRect.top + targetRect.height / 2 - 13;

        bullet.style.transition = 'all 0.15s ease-out';
        setTimeout(() => {
            bullet.style.left = `${destX}px`;
            bullet.style.top = `${destY}px`;
        }, 20);

        setTimeout(() => {
            bullet.remove();
            if (callback) callback();
        }, 170);
    }

    function loadQuestion() {
        if (currentIndex >= shuffledQuestions.length) {
            endGame();
            return;
        }

        selectedPinyin = null;
        selectedHanzi = null;
        
        const q = shuffledQuestions[currentIndex];
        document.getElementById('progress-display').innerText = `🎯 ${currentIndex + 1} / ${shuffledQuestions.length}`;
        document.getElementById('score-display').innerText = `⭐ Score: ${score}`;

        playGoogleTranslateAudio();

        let shuffledPinyin = [...q.pinyinOptions].sort(() => Math.random() - 0.5);
        let shuffledHanzi = [...q.hanziOptions].sort(() => Math.random() - 0.5);

        const pinyinContainer = document.getElementById('pinyin-options');
        pinyinContainer.innerHTML = '';
        shuffledPinyin.forEach(p => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.type = 'button';
            btn.innerText = p;
            btn.onclick = () => {
                shootBulletToTarget(btn, () => {
                    pinyinContainer.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedPinyin = p;
                });
            };
            pinyinContainer.appendChild(btn);
        });

        const hanziContainer = document.getElementById('hanzi-options');
        hanziContainer.innerHTML = '';
        shuffledHanzi.forEach(h => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.type = 'button';
            btn.innerText = h;
            btn.onclick = () => {
                shootBulletToTarget(btn, () => {
                    hanziContainer.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedHanzi = h;
                });
            };
            hanziContainer.appendChild(btn);
        });
    }

    function checkAnswer() {
        if (!selectedPinyin || !selectedHanzi) {
            alert("Please select both Pinyin and Hanzi! 🐾");
            return;
        }

        const q = shuffledQuestions[currentIndex];
        const isCorrectPinyin = (selectedPinyin === q.pinyin);
        const isCorrectHanzi = (selectedHanzi === q.word);

        if (isCorrectPinyin && isCorrectHanzi) {
            score += 10;
            document.getElementById('score-display').innerText = `⭐ Score: ${score}`;
            playSuccessSound();
            showFeedback(true, `🌟 Great job! (+10 pts) 🌟\nTarget: ${q.word} (${q.pinyin})`);
        } else {
            playErrorSound();
            showFeedback(false, `💫 Oops! 💫\nCorrect: ${q.word} (${q.pinyin})\nYours: ${selectedHanzi} (${selectedPinyin})`);
        }
    }

    function showFeedback(isCorrect, message) {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
        }
        const overlay = document.getElementById('message-overlay');
        const title = document.getElementById('overlay-title');
        const desc = document.getElementById('overlay-desc');
        const btn = document.getElementById('action-btn');

        overlay.style.display = 'flex';
        title.innerText = isCorrect ? "🎉 Awesome! 🎉" : "🎈 Try Again! 🎈";
        desc.innerText = message;
        btn.innerText = "Next 🚀";
        btn.onclick = nextQuestion;
    }

    function nextQuestion() {
        currentIndex++;
        document.getElementById('message-overlay').style.display = 'none';
        loadQuestion();
    }

    function endGame() {
        if (backgroundMusic) {
            clearInterval(backgroundMusic);
            backgroundMusic = null;
        }
        if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
        }
        const overlay = document.getElementById('message-overlay');
        const title = document.getElementById('overlay-title');
        const desc = document.getElementById('overlay-desc');
        const btn = document.getElementById('action-btn');

        overlay.style.display = 'flex';
        title.innerText = "🏆 You Win! 🏆";
        desc.innerText = `Final Score: ${score} points! You are amazing! 🦄✨`;
        btn.innerText = "Play Again 💖";
        btn.onclick = startGame;
    }
</script>
